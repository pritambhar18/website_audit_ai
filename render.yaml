services:
  - type: web
    name: qa-auditor
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run render-build
    startCommand: npm run start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PAGESPEED_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
